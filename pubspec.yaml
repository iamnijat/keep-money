name: keep_money

description: Expense tracker for people.

publish_to: "none"

version: 1.0.4+20

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  animate_do: ^3.3.4
  another_flushbar: ^1.12.29
  cupertino_icons: ^1.0.2
  dartz: ^0.10.1
  equatable: ^2.0.5
  fading_edge_scrollview: ^4.1.1
  fimber: ^0.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10
  flutter_svg_provider: ^1.0.7
  get_it: ^7.2.0
  graphql: ^5.1.3
  hive: ^2.2.1
  hive_flutter: ^1.1.0
  internet_connection_checker: ^1.0.0
  intl: ^0.20.2
  path_provider: ^2.1.3
  rxdart: ^0.27.5
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  sizer: ^2.0.15

dev_dependencies:
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.10.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/dev/icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/dev/
    - assets/icons/
    - assets/icons/avatars/
    - assets/images/
    - assets/icons/transaction_types/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
          weight: 700

    - family: Hind Madurai
      fonts:
        - asset: assets/fonts/hind_madurai/HindMadurai-Regular.ttf
        - asset: assets/fonts/hind_madurai/HindMadurai-Bold.ttf
          weight: 700
